# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
title                    : "Eric J. Mei"
title_separator          : "-"
name                     : &name "Eric J. Mei"
description              : &description "Research Page for EJM"
url                      : https://ericjmei.github.io # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "ericjmei/ericjmei.github.io"

# Site Author - drives the author info shown in the layout.
author:
  avatar           : "Headshot.jpg"
  name             : "Eric J. Mei"
  pronouns         : "he/him"
  bio              : "PhD student at the University of Washington Department of Atmospheric and Climate Science"
  email            : "emei@uw.edu"
  googlescholar    : "https://scholar.google.com/citations?user=y8gpQDoAAAAJ&hl=en"
  github           : "ericjmei"
  linkedin         : "eric-mei-595287173"


# Site Settings
future                   : true


# Reading Files
exclude:
  - .git
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Outputting
permalink: /:categories/:title/
timezone: America/Los_Angeles


# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
